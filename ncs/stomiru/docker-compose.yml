services:
  db:
    image: mysql:8.0.27
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d
      - mysql:/var/lib/mysql
    environment:
      - TZ=Asia/Tokyo
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=stress_check
  php:
    image: registry.gitlab.com/your-org/docker-images/php-laravel-nginx-dev:8.3
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    ports:
      - "${API_PORT}:80"
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    environment:
      - TZ=Asia/Tokyo
volumes:
  mysql:
    driver: local
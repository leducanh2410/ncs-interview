# context path
server.servlet.context-path=/bctcapi

#Datasource properties
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url={DB_URL}

# application.properties
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

spring.datasource.username={DB_USER}
spring.datasource.password={DB_PWD}

# App Properties
app.jwt.authType=Bearer
app.jwt.header=Authorization
app.jwt.header.prefix=Bearer 
app.jwt.secret=YOUR_JWT_SECRET_KEY
app.jwt.expiration=1800000

app.smartevnapi={EVNID_API_LOGIN}
app.splituseridandpass=<<<<!@@//@@!>>>>
pmis.app.jwtSecret={RSA_PRIVATE_KEY}
pmis.app.publicKey={RSA_PUBLIC_KEY}
pmis.app.jwtCookieName=pmisApiCore
pmis.app.jwtExpirationMs=86400000

app.xsrf.header=X-PMIS2-BCTC-XSRF-TOKEN
app.xsrf.cookie=PMIS2-BCTC-XSRF-TOKEN

#springdoc.api-docs.enabled=false
#springdoc.swagger-ui.enabled=false
pmis2.bctc.openapi.local-url=http://localhost:8081
pmis2.bctc.openapi.dev-url=https://dev.example.com
pmis2.bctc.openapi.prod-url=https://api.example.com

springdoc.api-docs.enabled={ENABLE_SWAGGER}
springdoc.swagger-ui.enabled={ENABLE_SWAGGER}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

springdoc.packages-to-scan=com.pmis.controllers
springdoc.swagger-ui.tryItOutEnabled=false
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.filter=true

app.jwt.orgcode=Org-Code
app.jwt.publickey.evn={RSA_PUBLIC_KEY_EVN}
app.jwt.publickey.gen1={RSA_PUBLIC_KEY_GEN1}
app.jwt.publickey.gen2={RSA_PUBLIC_KEY_GEN2}
app.jwt.publickey.gen3={RSA_PUBLIC_KEY_GEN3}
app.jwt.publickey.hn={RSA_PUBLIC_KEY_HN}
app.jwt.publickey.npc={RSA_PUBLIC_KEY_NPC}
app.jwt.publickey.cpc={RSA_PUBLIC_KEY_CPC}
app.jwt.publickey.spc={RSA_PUBLIC_KEY_SPC}
app.jwt.publickey.hcm={RSA_PUBLIC_KEY_HCM}
app.jwt.publickey.npt={RSA_PUBLIC_KEY_NPT}
app.jwt.publickey.sys={RSA_PUBLIC_KEY_SYS}
app.jwt.privatekey.sys={RSA_PRIVATE_KEY_SYS}

[program:laravel-queue-default]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work redis --queue=default --tries=3 --sleep=3
# Workers must not start with the container: at that point the new image is running
# against the old schema, and a job picked up before `artisan migrate` finishes burns
# all its retries on a missing column and lands in failed_jobs permanently.
# The deploy pipeline starts them with `supervisorctl start all` after migrating.
autostart=false
autorestart=true
stopasgroup=true
killasgroup=true
user=www
numprocs=4
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopwaitsecs=3600

[program:laravel-queue-chat-fcm]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work redis --queue=chat-fcm --tries=1 --timeout=300 --sleep=1
# See the note above: started by the deploy pipeline after migrations, not on container boot.
autostart=false
autorestart=true
stopasgroup=true
killasgroup=true
user=www
numprocs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopwaitsecs=3600

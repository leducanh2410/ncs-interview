services:
  db:
    image: ${DOCKER_DB_IMAGE:-mysql:8.0.27}
    container_name: "dgf_${APP_ENV}_db"
    restart: always
    volumes:
      - mysql:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
    environment:
      - TZ=Asia/Tokyo
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=dgf_connect
    # mysqld writes the slow log to a regular file (owned by the mysql user so mysqld can write it);
    # a background `tail -f` streams new entries to PID 1's stdout, which the awslogs driver forwards
    # to CloudWatch. The earlier `ln -sf /proc/1/fd/1` symlink approach does not work because MySQL
    # validates the log path with realpath() and rejects pipes (silently leaving slow_query_log OFF).
    command: >-
      bash -c "touch /var/log/slow.log && chown mysql:mysql /var/log/slow.log && tail -n0 -f /var/log/slow.log & exec docker-entrypoint.sh mysqld"
    logging:
      driver: "awslogs"
      options:
        awslogs-region: "${DOCKER_LOG_REGION:-ap-northeast-1}"
        awslogs-group: "dgf_${APP_ENV}"
        awslogs-stream: "db"
        awslogs-create-group: "true"
  php:
    image: ${DOCKER_BACK_IMAGE:-registry.gitlab.com/your-org/dgf-connect-web/backend/main:latest}
    container_name: "dgf_${APP_ENV}_php"
    restart: always
    working_dir: /var/www
    ports:
      - "${DOCKER_PHP_PORT}:80"
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    environment:
      - TZ=Asia/Tokyo
    depends_on:
      - db
      - redis
      - soketi
    logging:
      driver: "awslogs"
      options:
        awslogs-region: "${DOCKER_LOG_REGION:-ap-northeast-1}"
        awslogs-group: "dgf_${APP_ENV}"
        awslogs-stream: "php"
        awslogs-create-group: "true"
  redis:
    image: ${DOCKER_REDIS_IMAGE:-redis:6.2.6-alpine3.15}
    container_name: "dgf_${APP_ENV}_redis"
    restart: always
    volumes:
      - redis:/data
    logging:
      driver: "awslogs"
      options:
        awslogs-region: "${DOCKER_LOG_REGION:-ap-northeast-1}"
        awslogs-group: "dgf_${APP_ENV}"
        awslogs-stream: "redis"
        awslogs-create-group: "true"
  soketi:
    image: ${DOCKER_SOKETI_IMAGE:-quay.io/soketi/soketi:1.4-16-alpine}
    container_name: "dgf_${APP_ENV}_soketi"
    restart: always
    environment:
      - SOKETI_METRICS_ENABLED=false
      - SOKETI_DEFAULT_APP_ID=1
      - SOKETI_DEFAULT_APP_KEY=dgf-connect
      - SOKETI_DEFAULT_APP_SECRET=${DOCKER_SOKETI_SECRET}
      # Connection ceiling and how long an idle socket is kept. The activity timeout MUST stay larger
      # than the Flutter heartbeat / chat.notifications.active_conversation_ttl so live clients are not
      # dropped between pings. See backend/docs/chat-module-milestone-6.md (Soketi / Nginx review).
      - SOKETI_DEFAULT_APP_MAX_CONNECTIONS=${DOCKER_SOKETI_MAX_CONNECTIONS:-10000}
      - SOKETI_DEFAULT_APP_ACTIVITY_TIMEOUT=${DOCKER_SOKETI_ACTIVITY_TIMEOUT:-120}
    ports:
      - "${DOCKER_SOKETI_PORT}:6001"
    logging:
      driver: "awslogs"
      options:
        awslogs-region: "${DOCKER_LOG_REGION:-ap-northeast-1}"
        awslogs-group: "dgf_${APP_ENV}"
        awslogs-stream: "soketi"
        awslogs-create-group: "true"
volumes:
  mysql:
    driver: local
  redis:
    driver: local
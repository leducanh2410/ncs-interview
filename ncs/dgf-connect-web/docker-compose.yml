services:
  db:
    image: ${DOCKER_DB_IMAGE:-mysql:8.0.27}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d
      - mysql:/var/lib/mysql
    environment:
      - TZ=Asia/Tokyo
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=dgf_connect
  php:
    image: ${DOCKER_BACK_IMAGE:-registry.gitlab.com/your-org/docker-images/php-laravel-nginx-dev:8.5}
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    ports:
      - "${API_PORT}:80"
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    environment:
      - TZ=Asia/Tokyo
  redis:
    image: ${DOCKER_REDIS_IMAGE:-redis:6.2.6-alpine3.15}
    volumes:
      - redis:/data
  soketi:
    image: quay.io/soketi/soketi:1.4-16-alpine
    environment:
      - SOKETI_METRICS_ENABLED=false
      - SOKETI_DEFAULT_APP_ID=1
      - SOKETI_DEFAULT_APP_KEY=dgf-connect
      - SOKETI_DEFAULT_APP_SECRET=soketi_app_secret
    ports:
      - "${SOKETI_PORT}:6001"
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "18026:8025"
volumes:
  mysql:
    driver: local
  redis:
    driver: local

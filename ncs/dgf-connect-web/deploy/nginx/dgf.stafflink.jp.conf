# =============================================================================
# DGF Connect — frontend nginx server block
# =============================================================================
# Serves the Next.js static export (frontend/out) for the web app domain.
# This file is a canonical SAMPLE: copy it to the production server and adjust
# `root`, certificate paths, and the server_name to match the environment.
#
# Generated by `pnpm build` in ./frontend (next.config.mjs sets output:"export").
# The CI pipeline (.gitlab-ci.yml, .deploy_frontend) ships ./frontend/out to
# $STATIC_DIR on the host. This server block serves that directory.
#
# Why this config looks the way it does
# -------------------------------------
# Next.js static export emits prerendered HTML for every page. For dynamic
# routes it emits a LITERAL file named [id].html (e.g. admin/role/[id].html)
# containing the React shell for that route, which hydrates with whatever id
# the URL carries. So serving /admin/role/123 means mapping the URL to
# admin/role/[id].html on disk.
#
# The previous version of this file hard-coded an allow-list of which routes
# map to [id].html. That drifted from the code and caused 404s on direct
# visit / refresh for several routes (manage/shift, admin/group,
# admin/chat/support, admin/pdf-template, admin/user/export-history,
# manage/poll/[id]/results). The rules below are GENERIC so any current or
# future [id] route works without editing this file:
#
#   1. Any path ending in a numeric id  -> the route's own [id].html shell.
#   2. Everything else                  -> static file, else SPA fallback so
#      the client router handles deep links (e.g. /manage/exam/123/update)
#      and renders the in-app 404 page for unknown paths.
#
# NOTE: the API domain (api.<host>) is a SEPARATE server block that only does
# `proxy_pass` to the Laravel container. It is intentionally not kept here.
# =============================================================================

server {
    server_name dgf.example.com;
    root /var/www/example/dgf;

    charset utf-8;
    etag on;
    error_page 404 /404.html;

    # Next.js export assets are content-hashed and safe to cache aggressively.
    location ^~ /_next/static/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Apply a shorter cache window to other static files unless you also hash them.
    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|ico|webp|avif|woff|woff2|ttf|otf)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # Any path ending in a numeric id -> serve the prerendered [id].html shell
    # that Next.js exports for that segment. Generic, so it covers
    # /admin/role/123, /admin/chat/support/123, /manage/shift/123, etc.
    # without a hardcoded route list.
    location ~ ^(/.+)/(\d+)/?$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $1/[id].html /index.html;
    }

    # Everything else: static page if it exists, otherwise SPA fallback so the
    # client router handles deep links (/manage/exam/123/update,
    # /manage/user/123/schedule, /manage/poll/123/results) and unknown paths
    # (which render the in-app 404 page).
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri.html $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/dgf.example.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dgf.example.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = dgf.example.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name dgf.example.com;
    listen 80;
    return 404; # managed by Certbot
}

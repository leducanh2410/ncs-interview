; PHP 8.5 deprecates PDO::MYSQL_ATTR_SSL_CA (used in vendor/laravel/framework's
; own config/database.php), which fires on every request. Without this, the
; deprecation notice gets spliced into the HTTP response body ahead of the
; actual JSON, breaking every API call (including login) for API clients.
; Laravel's own exception handler still formats real errors for API responses;
; this only stops raw PHP-level notices from being echoed inline.
display_errors = Off
